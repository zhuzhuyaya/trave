<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>单文件 · 纯 CSS 动画</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap"
    />
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        background: #0d1117;
        color: #f0f6fc;
        font-family: 'Inter', system-ui, sans-serif;
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .card {
        text-align: center;
      }
      h1 {
        font-size: 120px;
        font-weight: 800;
        letter-spacing: -0.02em;
        /* A finite animation: the duration probe must read 2.4s. */
        animation: rise 2.4s cubic-bezier(.2, .8, .2, 1) both;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(60px) scale(.9); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      p {
        font-size: 34px;
        color: #8b949e;
        margin-top: 28px;
        /* A finite animation with a delay: 0.4 + 1.6 = 2.0s. */
        animation: rise 1.6s cubic-bezier(.2, .8, .2, 1) 0.4s both;
      }
      .dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #58a6ff;
        margin: 48px auto 0;
        /* Infinite: the probe must SKIP this one. */
        animation: breathe 1.4s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: .6; }
        50% { transform: scale(1.35); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello</h1>
      <p>single file · pure CSS</p>
      <div class="dot"></div>
    </div>
  </body>
</html>
