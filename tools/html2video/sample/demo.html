<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>旅行日记 · 视频管线演示</title>

    <!--
      External webfonts. This is the FOUT trap: under `domcontentloaded` the
      stylesheet below has usually not returned yet, so `document.fonts` is
      empty, `fonts.ready` resolves instantly, and the real face swaps in
      mid-clip unless the renderer waits for the link and calls face.load().
    -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=Noto+Serif+SC:wght@700&display=swap"
    />

    <style>
      :root {
        --bg: #0d1117;
        --ink: #f0f6fc;
        --muted: #8b949e;
        --accent: #58a6ff;
        --accent2: #f778ba;
        --good: #3fb950;
        --sans: 'Inter', 'Noto Serif SC', -apple-system, 'Segoe UI', system-ui, sans-serif;
        --serif: 'Noto Serif SC', 'Songti SC', serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background:
          radial-gradient(1200px 700px at 20% 15%, #16324f 0%, transparent 60%),
          radial-gradient(900px 600px at 85% 85%, #3a1f45 0%, transparent 55%),
          var(--bg);
      }
      .scene {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        opacity: 0;
      }
      .scene-badge {
        position: absolute;
        top: 72px;
        left: 88px;
        font-size: 22px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0;
      }
      .progress {
        position: absolute;
        left: 88px;
        right: 88px;
        bottom: 72px;
        height: 6px;
        border-radius: 3px;
        background: rgba(240, 246, 252, 0.12);
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
      }
      .watermark {
        position: absolute;
        right: 88px;
        bottom: 96px;
        font-size: 20px;
        color: var(--muted);
        opacity: 0;
      }
      .hint {
        position: absolute;
        left: 88px;
        bottom: 96px;
        font-size: 20px;
        color: var(--muted);
        opacity: 0;
      }

      /* --- decorative CSS animations (the duration probe must read these) --- */
      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      .blink {
        animation: blink 1.1s steps(1, end) infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.15; }
      }
      .shimmer {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          transparent 30%,
          rgba(255, 255, 255, 0.08) 50%,
          transparent 70%
        );
        animation: shimmer 3.2s linear infinite;
      }
      @keyframes shimmer {
        from { transform: translateX(-60%); }
        to { transform: translateX(60%); }
      }
    </style>
  </head>

  <body>
    <div id="stage">
      <!-- Multi-composition: these are fetched client-side by the template's
           own player. Chromium blocks fetch() on file://, so the renderer
           inlines them before loading. -->
      <div data-composition-src="scenes/intro.html"></div>
      <div data-composition-src="scenes/stats.html"></div>
      <div data-composition-src="scenes/outro.html"></div>

      <div class="scene-badge" id="badge">travel diary</div>
      <div class="progress"><div class="progress-fill" id="bar"></div></div>
      <div class="hint" id="hint">html-to-video pipeline · 实时录制</div>
      <div class="watermark" id="watermark">@trave</div>
    </div>

    <script>
      /*
       * A minimal timeline with the same surface the renderer drives:
       * play(from) / pause(t) / time(t) / duration() / repeat().
       * Steps are declarative — each one sets a final state from a 0..1
       * progress — so seeking is exact and idempotent.
       */
      window.__demo = {
        makeTimeline(key, steps, opts) {
          opts = opts || {};
          const tl = {
            _t: 0,
            _playing: false,
            _raf: 0,
            _origin: 0,
            duration() {
              return opts.duration !== undefined
                ? opts.duration
                : steps[steps.length - 1].at;
            },
            repeat() {
              return opts.repeat !== undefined ? opts.repeat : 0;
            },
            time(t) {
              this._seek(t);
              return this;
            },
            pause(t) {
              this._playing = false;
              cancelAnimationFrame(this._raf);
              this._raf = 0;
              if (typeof t === 'number') this._seek(t);
              return this;
            },
            play(from) {
              this._playing = true;
              this._origin = performance.now() - (from || 0) * 1000;
              const tick = () => {
                if (!this._playing) return;
                this._seek((performance.now() - this._origin) / 1000);
                this._raf = requestAnimationFrame(tick);
              };
              this._raf = requestAnimationFrame(tick);
              return this;
            },
            _seek(t) {
              this._t = t;
              for (const s of steps) {
                if (t >= s.at) {
                  const p = s.dur ? Math.min(1, (t - s.at) / s.dur) : 1;
                  s.run(p, t);
                }
              }
              if (opts.onTime) opts.onTime(t);
            },
          };
          window.__timelines = window.__timelines || {};
          window.__timelines[key] = tl;
          return tl;
        },
        set(el, props) {
          if (!el) return;
          for (const k in props) el.style[k] = props[k];
        },
      };

      // Master timeline: progress bar, badge, hints. Registered like any other
      // timeline so the renderer drives it from t=0.
      window.__demo.makeTimeline(
        'master',
        [
          { at: 0.0, dur: 0.4, run: (p) => {
              document.getElementById('badge').style.opacity = p;
            } },
          { at: 0.2, dur: 0.4, run: (p) => {
              document.getElementById('hint').style.opacity = p * 0.9;
            } },
          { at: 0.3, dur: 0.4, run: (p) => {
              document.getElementById('watermark').style.opacity = p * 0.9;
            } },
          { at: 0.0, dur: 6.4, run: (p) => {
              document.getElementById('bar').style.width = (p * 100).toFixed(2) + '%';
            } },
        ],
        { duration: 6.4 },
      );
    </script>
  </body>
</html>
