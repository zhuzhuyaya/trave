server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端 spring.servlet.multipart.max-request-size 是 40MB,
    # 而 nginx 默认只放行 1MB —— 不抬这一行,大图上传会先被 nginx 拦下,
    # 而且返回的是 HTML 错误页,前端解析 JSON 时只会报一句看不懂的错。
    client_max_body_size 40m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite 产物文件名带内容 hash,内容变了文件名就变,可以放心长缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 恰恰相反:它没有 hash,必须每次回源,
    # 否则发版后用户手里那个旧壳会一直去加载已经不存在的 assets 文件。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # /api 是 JWT 认证,不缓存。
    #
    # Host 必须用 $http_host 而不是 $host:$host 会丢掉端口号。
    # 端口一丢,后端看到的是 "Host: 1.2.3.4"(无端口),Tomcat 于是拿连接器端口
    # 8082 当作 serverPort,而浏览器发来的 Origin 是 http://1.2.3.4:8080 —— 两者不符,
    # Spring 就判定这是跨域请求,再一看 Origin 不在白名单里,直接回 403
    # "Invalid CORS request"。$http_host 原样透传浏览器发来的 Host(含端口),
    # 同源判断才成立,于是压根不走 CORS 这套逻辑。
    location /api/ {
        proxy_pass http://diary-server:8082;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 图片是 <img src> 直接请求的,不经过 axios,由后端 UploadProperties 映射成静态资源。
    # 文件名同样是随机生成的,可以缓存。
    location /uploads/ {
        proxy_pass http://diary-server:8082;
        proxy_set_header Host $http_host;
        expires 7d;
    }

    # vue-router 用的是 history 模式(createWebHistory):
    # 直接访问或刷新 /trips/3 这类深链接时,磁盘上并没有这个文件,
    # 不回退到 index.html 就是一片 404。这条必须放在最后兜底。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
